name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Validate release tag and version sync
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(
                  f"Release tag {tag} does not match pyproject version {version}; expected {expected}"
              )

          init_text = pathlib.Path("sugra_api_mcp/__init__.py").read_text(encoding="utf-8")
          init_match = re.search(r'^__version__\s*=\s*"([^"]+)"', init_text, re.MULTILINE)
          if init_match is None:
              raise SystemExit("Could not find __version__ in sugra_api_mcp/__init__.py")
          if init_match.group(1) != version:
              raise SystemExit(
                  f"__init__.py __version__ {init_match.group(1)} != pyproject version {version}"
              )

          server = json.loads(pathlib.Path("server.json").read_text(encoding="utf-8"))
          server_versions = [server.get("version")] + [p.get("version") for p in server.get("packages", [])]
          mismatched = [v for v in server_versions if v != version]
          if mismatched:
              raise SystemExit(
                  f"server.json version(s) {mismatched} != pyproject version {version}"
              )

          print(f"Version sync OK: tag={tag}, pyproject={version}, __init__ + server.json match")
          PY
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skip"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
