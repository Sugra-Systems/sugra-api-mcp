name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '.gitignore'
      - '**/*.md'
  pull_request:
    branches: [main]
  # workflow_dispatch is preserved deliberately: the hosted MCP
  # deploy (the `deploy` job below) is gated on it as the reliable manual kick.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,http]"
      - name: Ruff
        run: ruff check sugra_api_mcp tests
      - name: Pytest
        run: pytest
      - name: Import check
        run: python -c "import sugra_api_mcp; from sugra_api_mcp import tools"
      # Nothing rebuilds the bundled catalog when API routes land, so it drifts
      # behind the live spec silently and the new operations are simply absent
      # from search. Compare here and fail with the rebuild command. Runs on one
      # matrix leg only (the result is python-version independent) and reports
      # SKIPPED, not failed, when the spec host is unreachable - an outage must
      # not read as "the catalog drifted".
      - name: Catalog parity with the live spec
        if: matrix.python-version == '3.13'
        run: python scripts/check_catalog_parity.py
      - name: Tools registered
        env:
          SUGRA_API_KEY: dummy_test_key
        run: |
          python -c "
          import asyncio
          from sugra_api_mcp import tools
          from sugra_api_mcp.server import mcp
          from tests.test_metadata_sync import EXPECTED_TOOL_COUNT
          async def main():
              t = await mcp.list_tools()
              assert len(t) == EXPECTED_TOOL_COUNT, f'Expected {EXPECTED_TOOL_COUNT} tools, got {len(t)}'
              print(f'OK: {len(t)} tools registered')
          asyncio.run(main())
          "

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Hosted redeploy of the public MCP endpoint. `needs: test` chains off ALL
    # matrix legs in-file, rather than coupling to another workflow by name -
    # a name coupling breaks silently the moment the workflow is renamed.
    # TEMPORARY FREEZE: the hosted deploy is manual-only (workflow_dispatch)
    # while an external submission review runs against the live endpoint -
    # merges to main must not change what the reviewers are looking at. When the
    # review concludes, restore the original dual-trigger condition verbatim:
    #   if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 15
    # Serialize hosted deploys: the deploy updates one install tree in place, so
    # two runs at once can tear it. Inert while the freeze above keeps this job
    # on workflow_dispatch, but it must already be in place when the dual-trigger
    # condition is restored. JOB level, so the `test` matrix still runs in
    # parallel across runs; cancel-in-progress: false so a queued deploy waits
    # instead of killing an in-flight install or service restart.
    concurrency:
      group: mcp-deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Pre-deploy privilege probe
        # The deploy needs passwordless sudo on the target host. Probe it FIRST,
        # so a host-side permission problem fails here with a clear message
        # instead of dying halfway through an install.
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.APP_VM_HOST }}
          username: ${{ secrets.APP_VM_USER }}
          key: ${{ secrets.APP_VM_SSH_KEY }}
          script: |
            if ! sudo -n true 2>/dev/null; then
              echo "FAIL: passwordless sudo is unavailable on the deploy host. Restore it through the platform's management channel, then re-run this workflow. Deploys go through CI only."
              exit 1
            fi
            echo "sudo -n OK"
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.APP_VM_HOST }}
          username: ${{ secrets.APP_VM_USER }}
          key: ${{ secrets.APP_VM_SSH_KEY }}
          script: |
            set -e
            sudo /usr/local/bin/sugra-mcp-deploy
      - name: Post-deploy smoke (hosted MCP on app.sugra.ai)
        run: |
          for i in 1 2 3 4 5 6; do
            wk="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.sugra.ai/.well-known/oauth-protected-resource || echo 000)"
            mcp="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.sugra.ai/mcp || echo 000)"
            echo "attempt $i: .well-known -> $wk, /mcp -> $mcp"
            if [ "$wk" = "200" ] && [ "$mcp" != "404" ] && [ "$mcp" != "000" ]; then
              echo "hosted MCP surface healthy"
              exit 0
            fi
            sleep 10
          done
          echo "FAIL: hosted MCP did not come up (.well-known != 200 or /mcp == 404) after deploy."
          exit 1
