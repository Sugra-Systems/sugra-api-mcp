name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '.gitignore'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,http]"
      - name: Ruff
        run: ruff check sugra_api_mcp tests
      - name: Pytest
        run: pytest
      # The hosted server keeps the telemetry libraries it already has, older
      # than the ones a fresh install resolves above: run the shutdown tests on
      # those versions too, in a virtual environment of their own.
      - name: Shutdown on the hosted telemetry versions
        if: matrix.python-version == '3.13'
        run: |
          python -m venv "$RUNNER_TEMP/vm"
          "$RUNNER_TEMP/vm/bin/pip" install -e ".[dev,http]" "azure-monitor-opentelemetry==1.8.8"
          "$RUNNER_TEMP/vm/bin/pytest" tests/test_shutdown.py
      - name: Import check
        run: python -c "import sugra_api_mcp; from sugra_api_mcp import tools"
      # Nothing rebuilds the bundled catalog when API routes land, so it drifts
      # behind the live spec silently and the new operations are simply absent
      # from search. Compare here and fail with the rebuild command. Runs on one
      # matrix leg only (the result is python-version independent) and reports
      # SKIPPED, not failed, when the spec host is unreachable - an outage must
      # not read as "the catalog drifted".
      - name: Catalog parity with the live spec
        if: matrix.python-version == '3.13'
        run: python scripts/check_catalog_parity.py
      - name: Tools registered
        env:
          SUGRA_API_KEY: dummy_test_key
        run: |
          python -c "
          import asyncio
          from sugra_api_mcp import tools
          from sugra_api_mcp.server import mcp
          from tests.test_metadata_sync import EXPECTED_TOOL_COUNT
          async def main():
              t = await mcp.list_tools()
              assert len(t) == EXPECTED_TOOL_COUNT, f'Expected {EXPECTED_TOOL_COUNT} tools, got {len(t)}'
              print(f'OK: {len(t)} tools registered')
          asyncio.run(main())
          "
