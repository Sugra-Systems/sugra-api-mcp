# tier-gate : mechanical tier-floor per
# FLEET-PROTOCOL section 3. NON-required at introduction (green-before-require);
# becomes required via APPEND-ONLY:
#   gh api -X POST repos/<org>/<repo>/branches/main/protection/required_status_checks/contexts -f 'contexts[]=tier-gate'
# (never PATCH the whole required_status_checks object - that risks dropping `test`).
#
# SECURITY (a review round, ): pull_request_target, NOT pull_request. On
# pull_request the workflow + script execute from the PR's MERGE commit, so a PR
# could tamper tier_gate.py/this yml and report a green `tier-gate` context -
# a self-bypass of the gate (the exact move a prompt-injected agent would try).
# pull_request_target executes the BASE-branch version of this workflow, the
# script, and the paths config - the PR cannot modify what judges it. The gate
# NEVER checks out or executes PR code: it reads the PR's changed-file LIST and
# labels via the API, and reads a vendored CHANGE.md via the contents API.
#
# an unmet tier-gate is a NORMAL in-progress state, not a failure. The
# gate reports as a `tier-gate` CHECK-RUN on the PR head:
#   - satisfied      -> completed / success   (merge allowed)
#   - not yet met    -> in_progress (pending) (blocks merge, NOT a failure)
#   - genuine fault  -> completed / failure   (blocks merge AND fails the run)
# "Not yet met" means the tier:T# label is missing, release:human-ok is still
# awaited, or a declared value needs adjusting - the author or a human simply has
# not acted. That was 181 failed runs across the org, each emailing "Run failed"
# for a state that is just work in progress. An `in_progress` required check still
# blocks merge; only a real fault (config unreadable, gh failed, CHANGE.md
# unfetchable at head) fails the run and alerts.
#
# Unlike review-quorum this workflow has NO issue_comment trigger, which makes the
# design strictly simpler: every run is a pull_request_target run, so the job's own
# auto check-run lands on the PR HEAD (on issue_comment it would land on the
# default-branch sha). `tier-gate-eval` is therefore a FULL outage backstop here -
# if the checks API cannot be written at all, the failing job still blocks the head.
#
# BOTH contexts are MANDATORY, not a suggestion (review feedback). Renaming the job removed
# the instant block GitHub used to give for free: a job literally named `tier-gate`
# created its check-run the moment the workflow dispatched, so the required context
# went non-success immediately. Now `tier-gate` is written by the baseline step,
# tens of seconds later - and in that startup window a prior `completed/success` on
# the same head is still the latest result. That is exactly the unlabel-after-green
# race this design exists to close. `tier-gate-eval`'s own check-run DOES appear at
# dispatch, so requiring it closes the window. Ship them in lockstep:
#   gh api -X POST repos/<org>/<repo>/branches/main/protection/required_status_checks/contexts \
#     -f 'contexts[]=tier-gate' -f 'contexts[]=tier-gate-eval'
# Enabling this workflow with only `tier-gate` required leaves the startup race
# open - do not do it.
#
# Design invariants (see .github/workflows/tier_gate.py):
# - label events (labeled/unlabeled) re-run the check so applying tier:T# /
#   release:human-ok flips it; ready_for_review covers draft promotion.
# - NO `paths:` filter: the job reports on EVERY PR and exits fast when nothing
#   high-risk is touched (a path-filtered required check strands low-risk PRs
#   in "Expected" limbo).
name: tier-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited, ready_for_review]
    branches:
      - main

# One run at a time per PR. cancel-in-progress stays FALSE : cancellation happens at the workflow level and a concurrency group holds
# exactly ONE pending run - a newly queued run cancels the previously pending one.
# Queueing keeps completion order so the newest state always gets posted. There is
# no job-level skip filter here, so every queued run evaluates and reports; that is
# what makes queueing safe.
concurrency:
  group: tier-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  # checks: write is needed to POST the `tier-gate` check-run to the PR head. Safe
  # on this pull_request_target workflow specifically because it never checks out
  # or executes PR code - the hazard of pull_request_target is running untrusted
  # code with elevated rights, and this runs none.
  checks: write

jobs:
  # Named `tier-gate-eval`, NOT `tier-gate` . The verdict-bearing required
  # context is the `tier-gate` CHECK-RUN this job POSTs - never this job's own auto
  # check-run, because exiting 0 on a pending gate would turn a job literally named
  # `tier-gate` green and open the gate. `tier-gate-eval` should ALSO be required,
  # as the outage backstop described in the header.
  tier-gate-eval:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REPO: ${{ github.repository }}
    steps:
      # default checkout on pull_request_target = the BASE ref (trusted): the
      # gate script + tier-floor-paths.txt come from main, never from the PR.
      - uses: actions/checkout@v4

      # FAIL-CLOSED baseline : mark the head `in_progress` BEFORE
      # evaluating, so a run that dies mid-flight leaves the head BLOCKED rather
      # than carrying a stale `success` from an earlier run on the same sha (a
      # label removed after a green run is exactly that case). HARD-REQUIRED, not
      # best-effort: it retries and fails loudly if it cannot land the mark, since
      # proceeding over a possibly-green head is the hole this closes.
      - name: Mark tier-gate pending on the PR head (fail-closed baseline)
        run: |
          set -uo pipefail
          for a in 1 2 3; do
            if gh api -X POST "repos/$REPO/check-runs" \
                 -f name='tier-gate' -f head_sha="$HEAD_SHA" \
                 -f status='in_progress' \
                 -f 'output[title]=tier-gate: evaluating' \
                 -f 'output[summary]=Re-evaluating the tier floor. Merge is blocked until this resolves to success.' \
                 > /dev/null 2>&1; then
              echo "baseline in_progress posted (attempt $a)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::could not post the in_progress baseline after 3 attempts - refusing to proceed while a possibly-stale success remains the latest tier-gate result on this head"
          exit 1

      - name: Evaluate the tier floor
        run: |
          set -uo pipefail
          # Capture the exit code instead of failing here: the Report step must run
          # regardless. tee keeps the output live in the log AND captured for the
          # check-run summary; pipefail is off around it so PIPESTATUS[0] holds the
          # script's real code (0 pass / 2 pending / 3 fault) rather than tee's 0.
          set +o pipefail
          python3 .github/workflows/tier_gate.py \
            --pr "$PR_NUMBER" --repo "$REPO" --head-sha "$HEAD_SHA" 2>&1 \
            | tee "$RUNNER_TEMP/tier-gate.txt"
          rc=${PIPESTATUS[0]}
          set -o pipefail
          echo "rc=$rc" >> "$GITHUB_ENV"
          # Always succeed: the outcome travels as the check-run below, not as this
          # job's conclusion. A pending tier-gate must not fail the run.
          exit 0

      # `!cancelled()`: a run that dies mid-flight must still report, otherwise the
      # head keeps whatever it had before (a stale success would open the gate).
      - name: Report tier-gate on the PR head
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          # rc -> check-run state. ONE definition, tier_gate.py's check_run_plan
          # (unit-tested), fetched via --plan so bash and Python cannot drift.
          # `${rc:-3}` maps an unset rc (a crashed script) to failure; a failed or
          # unparseable --plan collapses to a completed failure. Fail closed: no
          # path here can mint a `success` the evaluation did not produce.
          PLAN=$(python3 .github/workflows/tier_gate.py --plan "${rc:-3}" 2>/dev/null || true)
          read -r STATUS CONCLUSION <<< "$PLAN" || true
          case "${STATUS:-}" in
            in_progress) CONCLUSION='' ;;
            completed)
              # `completed` REQUIRES a conclusion; only `success` is trusted through.
              [ "${CONCLUSION:-}" = "success" ] || CONCLUSION='failure' ;;
            *) STATUS='completed'; CONCLUSION='failure' ;;
          esac
          case "$STATUS:${CONCLUSION:-}" in
            completed:success) TITLE='tier-gate met' ;;
            in_progress:*)     TITLE='tier-gate pending - not yet met (blocks merge, not a failure)' ;;
            *)                 TITLE='tier-gate system fault' ;;
          esac
          ARGS=(-f status="$STATUS" -f "output[title]=$TITLE")
          [ -n "${CONCLUSION:-}" ] && ARGS+=(-f conclusion="$CONCLUSION")
          SUMMARY=$(head -c 60000 "$RUNNER_TEMP/tier-gate.txt" 2>/dev/null \
                    || echo "tier-gate output was not captured - see the job log")
          for attempt in 1 2 3; do
            if gh api -X POST "repos/$REPO/check-runs" \
                 -f name='tier-gate' -f head_sha="$HEAD_SHA" \
                 "${ARGS[@]}" \
                 -f "output[summary]=$SUMMARY" > /dev/null; then
              echo "posted tier-gate (rc=${rc:-unset}) on $HEAD_SHA (attempt $attempt)"
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::check-run POST failed 3x - the head still carries the in_progress baseline (blocked), but the detailed result did not land"
              exit 1
            fi
            sleep 5
          done

      # The ONLY path that fails the run (and so alerts): an rc that is neither
      # pass (0) nor pending (2) - a genuine fault (3) or an unexpected crash. A
      # bare `exit 1` must not slip through as a green run.
      - name: Fail the run only on a genuine fault
        if: ${{ env.rc != '0' && env.rc != '2' }}
        run: |
          echo "::error::tier-gate did not complete normally (rc=${rc:-unset}) - a real failure, unlike a pending tier-gate"
          exit 1
